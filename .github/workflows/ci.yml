name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install npm
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Verify generated and formatted files
        run: git diff --exit-code

      - name: Test
        run: npm test

      - name: Pack npm artifact
        id: pack
        run: |
          package_dir="$RUNNER_TEMP/pi-package"
          package_version="$(node -p "require('./package.json').version")"
          tarball="$package_dir/astralyn-pi-$package_version.tgz"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --silent --pack-destination "$package_dir" >/dev/null
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify packed package installation
        run: npm run verify:package-install -- "${{ steps.pack.outputs.tarball }}"
