name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example, 0.82.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish @astralyn/pi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch recorded upstream baseline tag
        run: |
          upstream_repository="$(node -p "require('./maintainers/upstream.json').baseline.repository")"
          upstream_tag="$(node -p "require('./maintainers/upstream.json').baseline.tag")"
          git fetch --depth=1 --no-tags --force "https://github.com/${upstream_repository}.git" "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Verify release request
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release workflow must run from main (got $GITHUB_REF)." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!version || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected a stable numeric version such as 0.82.0, got ${version ?? "nothing"}.`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const shrinkwrap = JSON.parse(readFileSync("npm-shrinkwrap.json", "utf8"));
          const changelog = readFileSync("CHANGELOG.md", "utf8");

          if (packageJson.name !== "@astralyn/pi") {
            throw new Error(`Expected the root package to be @astralyn/pi, got ${packageJson.name}.`);
          }
          if (packageJson.version !== version || shrinkwrap.version !== version) {
            throw new Error(
              `Release input ${version} must match package.json (${packageJson.version}) and npm-shrinkwrap.json (${shrinkwrap.version}).`,
            );
          }
          const releaseHeading = `## [${version}] - `;
          const headingCount = changelog.split("\n").filter((line) => line.startsWith(releaseHeading)).length;
          if (headingCount !== 1) {
            throw new Error(`Expected exactly one CHANGELOG.md release heading for ${version}, found ${headingCount}.`);
          }
          NODE

          if npm view "@astralyn/pi@$RELEASE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@astralyn/pi@$RELEASE_VERSION is already published; its provenance must identify this commit before verification resumes."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build release artifact
        run: npm run prepublishOnly

      - name: Check
        run: npm run check

      - name: Verify upstream delta
        run: npm run diff:upstream -- --check

      - name: Verify generated files
        run: git diff --exit-code

      - name: Test
        run: npm test

      - name: Pack npm artifact
        id: pack
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/pi-package"
          tarball="$package_dir/astralyn-pi-$RELEASE_VERSION.tgz"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --silent --pack-destination "$package_dir" >/dev/null
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify existing registry provenance
        if: steps.release.outputs.already_published == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          const packageName = "@astralyn/pi";
          const encodedPackageName = encodeURIComponent(packageName);
          const response = await fetch(
            `https://registry.npmjs.org/-/npm/v1/attestations/${encodedPackageName}@${process.env.RELEASE_VERSION}`,
          );
          if (!response.ok) {
            throw new Error(`Failed to load npm attestations: ${response.status} ${response.statusText}`);
          }
          const body = await response.json();
          const provenance = body.attestations?.find(
            (attestation) => attestation.predicateType === "https://slsa.dev/provenance/v1",
          );
          if (!provenance) {
            throw new Error("Published package has no SLSA provenance attestation.");
          }
          const statement = JSON.parse(
            Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64url").toString("utf8"),
          );
          const source = statement.predicate?.buildDefinition?.resolvedDependencies?.find(
            (dependency) => dependency.uri === "git+https://github.com/ming-kang/pi@refs/heads/main",
          );
          const publishedCommit = source?.digest?.gitCommit;
          if (publishedCommit !== process.env.GITHUB_SHA) {
            throw new Error(
              `Published provenance identifies commit ${publishedCommit ?? "unknown"}, not ${process.env.GITHUB_SHA}.`,
            );
          }
          console.log(`Published provenance identifies commit ${publishedCommit}.`);
          NODE

      - name: Verify packed package installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run verify:package-install -- "${{ steps.pack.outputs.tarball }}" "$RELEASE_VERSION"

      - name: Publish verified artifact
        if: steps.release.outputs.already_published != 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --registry=https://registry.npmjs.org

      - name: Wait for registry metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            published="$(npm view "@astralyn/pi@$RELEASE_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then
              echo "Verified @astralyn/pi@$RELEASE_VERSION metadata on npm."
              exit 0
            fi
            sleep 10
          done
          echo "Published version was not visible on npm after two minutes." >&2
          exit 1

      - name: Verify registry installation
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          PI_PACKAGE_ALLOW_FRESH: "1"
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 6); do
            if npm run verify:package-install -- "@astralyn/pi@$RELEASE_VERSION" "$RELEASE_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Registry installation attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "Published package could not be installed and smoke-tested from npm." >&2
          exit 1
