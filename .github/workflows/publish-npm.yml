name: Publish npm
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["pi-v*"]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and main ancestry
        id: release
        run: |
          version="${GITHUB_REF_NAME#pi-v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main." >&2
            exit 1
          }

          RELEASE_VERSION="$version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected a stable numeric version tag such as pi-v1.0.0, got ${version}.`);
          }
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const shrinkwrap = JSON.parse(readFileSync("npm-shrinkwrap.json", "utf8"));
          if (packageJson.name !== "@astralyn/pi") {
            throw new Error(`Expected the root package to be @astralyn/pi, got ${packageJson.name}.`);
          }
          if (packageJson.version !== version || shrinkwrap.version !== version) {
            throw new Error(
              `Tag version ${version} must match package.json (${packageJson.version}) and npm-shrinkwrap.json (${shrinkwrap.version}).`,
            );
          }
          const releaseHeading = `## [${version}] - `;
          const headingCount = readFileSync("CHANGELOG.md", "utf8")
            .split("\n")
            .filter((line) => line.startsWith(releaseHeading)).length;
          if (headingCount !== 1) {
            throw new Error(`Expected exactly one CHANGELOG.md release heading for ${version}, found ${headingCount}.`);
          }
          NODE

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@astralyn/pi@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::@astralyn/pi@$version is already published; publication will be skipped."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified artifact
    needs: [release, ci]
    if: needs.release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Publish
        run: npm publish "./package/astralyn-pi-${{ needs.release.outputs.version }}.tgz" --access public --provenance --registry=https://registry.npmjs.org
