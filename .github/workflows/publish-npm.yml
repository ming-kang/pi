name: CI and publish

# Every push to main runs CI here. When CI passes and package.json names a version that npm
# does not have yet, the tarball CI verified is published and its commit is tagged pi-v<version>.
# npm trusted publishing is bound to this file name, so keep it.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue instead of cancelling, so a newer push never interrupts a publication.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  plan:
    name: Check for an unpublished version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare package.json with npm
        id: plan
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@astralyn/pi@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_VERSION="$version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Only stable major.minor.patch versions are published, got ${version}.`);
          }
          const headings = readFileSync("CHANGELOG.md", "utf8")
            .split("\n")
            .filter((line) => line.startsWith(`## [${version}] - `));
          if (headings.length !== 1) {
            throw new Error(`Expected one CHANGELOG.md heading for ${version}, found ${headings.length}. Use npm run release.`);
          }
          NODE

          echo "::notice::@astralyn/pi@$version is not on npm yet and publishes once CI passes."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified artifact
    needs: [plan, ci]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install OIDC-capable npm
        run: npm install --global npm@12.2.1

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Publish
        run: npm publish "./package/astralyn-pi-${{ needs.plan.outputs.version }}.tgz" --access public --provenance --registry=https://registry.npmjs.org

  tag:
    name: Tag the published commit
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create pi-v${{ needs.plan.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pi-v${{ needs.plan.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
