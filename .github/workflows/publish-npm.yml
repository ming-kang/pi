name: CI and publish

# Every push to main runs CI here, and each commit's run completes on its own. Only a release
# commit publishes: "chore: release <version>" from npm run release, for a version npm does not
# have yet. Once CI passes, the tarball it verified goes to npm and that commit is tagged
# pi-v<version>, so the tag, the package, and the changelog section always match.
# npm trusted publishing is bound to this file name, so keep it.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Check for a release commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this commit publishes
        id: plan
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Any other commit only runs CI, even while npm lacks this version.
          if [ "$(git log -1 --format=%s)" != "chore: release $version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published="$(npm view "@astralyn/pi@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::notice::@astralyn/pi@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_VERSION="$version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Only stable major.minor.patch versions are published, got ${version}.`);
          }
          const headings = readFileSync("CHANGELOG.md", "utf8")
            .split("\n")
            .filter((line) => line.startsWith(`## [${version}] - `));
          if (headings.length !== 1) {
            throw new Error(`Expected one CHANGELOG.md heading for ${version}, found ${headings.length}. Use npm run release.`);
          }
          NODE

          echo "::notice::Release commit for @astralyn/pi@$version; it publishes once CI passes."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified artifact
    needs: [plan, ci]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Publications never overlap; a newer release waits for the one in progress.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install OIDC-capable npm
        run: npm install --global npm@12.2.1

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Publish
        run: npm publish "./package/astralyn-pi-${{ needs.plan.outputs.version }}.tgz" --access public --provenance --registry=https://registry.npmjs.org

  tag:
    name: Tag the published commit
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create pi-v${{ needs.plan.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pi-v${{ needs.plan.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
