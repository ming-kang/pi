name: Upstream release audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch recorded upstream baseline tag
        run: |
          upstream_repository="$(node -p "require('./maintainers/upstream.json').baseline.repository")"
          upstream_tag="$(node -p "require('./maintainers/upstream.json').baseline.tag")"
          git fetch --depth=1 --no-tags --force "https://github.com/${upstream_repository}.git" "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

      - name: Report upstream release tags
        id: releases
        run: node scripts/audit-upstream-releases.mjs

      - name: Verify current upstream boundary
        run: npm run diff:upstream -- --check

      - name: Simulate an exact-baseline zero-delta worktree
        run: node node_modules/vitest/dist/cli.js --run test/diff-upstream.test.mjs -t "synthetic exact-baseline worktree"

      - name: Assert clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
